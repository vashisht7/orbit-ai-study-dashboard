<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Inside one Transformer block</title><desc id="desc">Input X flows through normalization and causal attention, then adds the original X through a bypass. H flows through normalization and a feed-forward network, then adds H through another bypass to produce Y.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b3d5f4"/></marker></defs>
<rect width="760" height="620" rx="14" fill="#192b3d"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#e2edf7">
<text x="380" y="36" font-size="22" font-weight="700">One block: mix tokens, then mix features</text>
<g fill="#203247" stroke="#8eacc7" stroke-width="2"><rect x="240" y="95" width="280" height="54" rx="8"/><rect x="240" y="176" width="280" height="64" rx="8"/><circle cx="380" cy="282" r="20"/><rect x="240" y="337" width="280" height="54" rx="8"/><rect x="240" y="418" width="280" height="64" rx="8"/><circle cx="380" cy="524" r="20"/></g>
<g stroke="#b3d5f4" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M380 64V93"/><path d="M380 149V174"/><path d="M380 240V260"/><path d="M380 302V335"/><path d="M380 391V416"/><path d="M380 482V502"/><path d="M380 544V578"/><path d="M380 76H135V282H357"/><path d="M380 319H625V524H403"/></g>
<g font-size="18"><text x="380" y="65">X</text><text x="380" y="129">Normalize</text><text x="380" y="203">Causal multi-head attention</text><text x="380" y="226" font-size="13">Exchange information across tokens</text><text x="380" y="289">+</text><text x="415" y="323">H</text><text x="380" y="371">Normalize</text><text x="380" y="445">Feed-forward network</text><text x="380" y="468" font-size="13">Transform features within each token</text><text x="380" y="531">+</text><text x="380" y="601">Y → next block</text><text x="132" y="185" font-size="14" transform="rotate(-90 132 185)">Carry original X forward</text><text x="650" y="425" font-size="14" transform="rotate(90 650 425)">Carry H forward</text></g></g></svg>
